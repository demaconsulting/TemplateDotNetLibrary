<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="14" y="16" width="935" height="435" rx="28" fill="#d5dce6"/>
  <rect x="10" y="10" width="935" height="435" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <g transform="translate(30,30)">
    <rect x="170" y="0" width="520" height="60" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="430" y="27" font-size="16" font-weight="600" fill="#92400e" text-anchor="middle">Your application</text>
    <text x="430" y="47" font-size="13" fill="#92400e" text-anchor="middle">references the TemplateDotNetLibrary NuGet package</text>
    <line x1="430" y1="64" x2="430" y2="100" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <text x="442" y="86" font-size="12" fill="#334155">creates a Demo and calls it</text>

    <rect x="170" y="104" width="520" height="188" rx="14" fill="#f8fafc" stroke="#2563eb" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="186" y="126" font-size="14" font-weight="600" fill="#2563eb">DemaConsulting.TemplateDotNetLibrary</text>

    <rect x="190" y="136" width="480" height="140" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="430" y="160" font-size="16" font-weight="600" fill="#4c1d95" text-anchor="middle">Demo</text>
    <text x="430" y="178" font-size="12" fill="#5b21b6" text-anchor="middle">Immutable, thread-safe greeting class</text>
    <g font-size="11" fill="#5b21b6" text-anchor="middle">
      <rect x="204" y="192" width="140" height="72" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
      <text x="274" y="214" font-size="13" font-family="Consolas, monospace" font-weight="600" fill="#4c1d95">Demo(prefix)</text>
      <text x="274" y="234">Constructors; the default</text>
      <text x="274" y="248">prefix is "Hello"</text>
      <rect x="360" y="192" width="140" height="72" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
      <text x="430" y="214" font-size="13" font-family="Consolas, monospace" font-weight="600" fill="#4c1d95">Prefix</text>
      <text x="430" y="234">Read-only property that</text>
      <text x="430" y="248">returns the prefix</text>
      <rect x="516" y="192" width="140" height="72" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
      <text x="586" y="214" font-size="13" font-family="Consolas, monospace" font-weight="600" fill="#4c1d95">DemoMethod(name)</text>
      <text x="586" y="234">Returns a greeting such</text>
      <text x="586" y="248">as "Hello, World!"</text>
    </g>

    <line x1="430" y1="296" x2="430" y2="320" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <text x="442" y="312" font-size="12" fill="#334155">ships in one package targeting</text>

    <g text-anchor="middle">
      <rect x="170" y="324" width="118" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
      <text x="229" y="350" font-size="15" font-weight="600" fill="#334155">.NET Std</text>
      <text x="229" y="370" font-size="12" fill="#475569">netstandard2.0</text>
      <rect x="304" y="324" width="118" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
      <text x="363" y="350" font-size="15" font-weight="600" fill="#334155">.NET 8</text>
      <text x="363" y="370" font-size="12" fill="#475569">net8.0</text>
      <rect x="438" y="324" width="118" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
      <text x="497" y="350" font-size="15" font-weight="600" fill="#334155">.NET 9</text>
      <text x="497" y="370" font-size="12" fill="#475569">net9.0</text>
      <rect x="572" y="324" width="118" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
      <text x="631" y="350" font-size="15" font-weight="600" fill="#334155">.NET 10</text>
      <text x="631" y="370" font-size="12" fill="#475569">net10.0</text>
    </g>

    <text x="70" y="151" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">Inputs</text>
    <rect x="0" y="165" width="140" height="66" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="70" y="192" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">Arguments</text>
    <text x="70" y="213" font-size="12" fill="#475569" text-anchor="middle">name, optional prefix</text>
    <line x1="144" y1="198" x2="166" y2="198" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

    <rect x="720" y="133" width="165" height="130" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="802" y="159" font-size="16" font-weight="600" fill="#166534" text-anchor="middle">Outputs</text>
    <g font-size="13" fill="#14532d" text-anchor="middle">
      <rect x="734" y="171" width="137" height="26" rx="5" fill="#ffffff" stroke="#16a34a"/>
      <text x="802" y="189">Greeting string</text>
      <rect x="734" y="201" width="137" height="26" rx="5" fill="#ffffff" stroke="#16a34a"/>
      <text x="802" y="219">Prefix value</text>
      <rect x="734" y="231" width="137" height="26" rx="5" fill="#ffffff" stroke="#16a34a"/>
      <text x="802" y="249">Argument exceptions</text>
    </g>
    <line x1="694" y1="198" x2="716" y2="198" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  </g>
</svg>
