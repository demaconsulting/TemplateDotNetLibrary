---
# Spell-Checking with TextLint
#
# PURPOSE:
# - Maintain professional documentation and code quality
# - Catch spelling errors before publication
# - Support consistent technical terminology usage
# - Misspelled words should be fixed in the source
# - NEVER add a misspelled word to the 'words' list
# - PROPOSE only genuine technical terms/names as needed

version: "0.2"
language: en

# Matches cspell, which also checks hidden paths such as .github/ and .*.yaml
enableGlobDot: true

# The files TextLint spell-checks
files:
  - "**/*.{md,yaml,yml,json,cs,cpp,hpp,h,txt}"

# Project-specific technical terms and tool names
words:
  - sonarscanner
  - demaconsulting
  - pandoctool
  - weasyprinttool
  - opencover
  - snupkg
  - ncipollo
  - DEMACONSULTINGNUGETKEY
  - Setext
  - venv
  - thirdparty
  - shopt
  - unidirectionality
  - nestings
  - buildmark
  - canvasnet
  - DEMA
  - Dema
  - FileAssert
  - fileassert
  - xunit
  - Pandoc
  - Qube
  - reqstream
  - reviewmark
  - Sarif
  - SARIF
  - sarifmark
  - sonarmark
  - sysml
  - versionmark
  - Weasy
  - WeasyPrint
  - weasyprint
  - netstandard
  - yamlfix

# Exclude common build artifacts, dependencies, and vendored third-party code
ignorePaths:
  - "**/.git/**"
  - "**/node_modules/**"
  - "**/.venv/**"
  - "**/thirdparty/**"
  - "**/third-party/**"
  - "**/3rd-party/**"
  - "**/generated/**"
  - "**/AGENT_REPORT_*.md"
  - "**/.agent-logs/**"
  - "**/bin/**"
  - "**/obj/**"
  - package-lock.json
